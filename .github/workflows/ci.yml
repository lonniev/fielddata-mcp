name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The build-and-verify contract every DPYC MCP shares — install the way
      # Horizon installs, lint, prove the entrypoint, run the suite. Kept as a
      # composite action rather than a reusable workflow so this job keeps its
      # name, and with it the `test` status context branch protection requires.
      - uses: lonniev/dpyc-community/.github/actions/mcp-ci@main

  # The site's tests, typecheck and build: without this job a frontend PR is green unbuilt.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
        env:
          VITE_MCP_URL: /mcp
